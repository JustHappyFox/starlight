# Конфиг wm_watchdog. Скопируй в config.ini и поправь под себя.
# Комментарии — только отдельной строкой, начинающейся с # или ;
# (в конце строки со значением комментарий писать нельзя — он станет частью значения).

[watchdog]
# Как часто опрашивать асики, секунд.
interval = 60

# Сколько подряд плохих проверок, прежде чем что-то делать (3 × 60 с = 3 минуты).
# Защищает от реакции на кратковременные провалы.
bad_checks = 3

# Что делать с упавшим асиком. Варианты:
#   reboot  — полная перезагрузка (то же, что ты делаешь руками в веб-морде);
#   restart — перезапуск только майнера btminer (быстрее, но при отвале БП помогает не всегда);
#   hook    — внешняя команда из on_unreachable (например, дёрнуть умную розетку).
# Можно цепочкой: "restart, reboot" — сначала мягко, если не помогло — ребут.
actions = reboot

# Сколько ждать после действия, прежде чем пробовать ещё раз, секунд.
action_cooldown = 600

# Сколько секунд после старта майнера не трогать асик (прогрев, подбор частот).
# Если асик за это время так и не начал хешировать — всё равно считаем проблемой.
grace_period = 900

# Не больше стольких действий за час на один асик. Если не помогает — пришлёт
# «нужен осмотр» и попробует снова позже. Защита от бесконечного ребут-цикла.
max_actions_per_hour = 3

# Асик считается упавшим, если:
#   - хешрейт 0;
#   - или хешрейт меньше min_hashrate_pct % от нормы (норма = expected_ths, если задан,
#     иначе заводской хешрейт, который отдаёт сам асик). 0 = не проверять;
#   - или одна из плат перестала хешировать (check_dead_boards).
min_hashrate_pct = 50
check_dead_boards = yes

# «Майнер завис»: асик ушёл в ошибку (часто по БП/напряжению), а API продолжает отдавать
# последний хешрейт. Ловим по тому, что цифры перестали меняться: аптайм не растёт или
# 5s/1m-хешрейт одинаковый столько опросов подряд. 0 = не проверять.
stale_checks = 2

# Если вентиляторы крутятся медленнее этого (об/мин) — платы стоят, даже если хешрейт на
# экране «живой». При майнинге у воздушных Whatsminer обычно тысячи оборотов.
# 0 = не проверять. Гидро/иммерсия (0 оборотов) пропускаются автоматически.
min_fan_rpm = 600

# Коды ошибок, при которых перезагружать, даже если хешрейт выглядит нормально
# (ошибка должна держаться bad_checks опросов подряд). Через запятую, например:
#   fault_codes = 202, 206
# Пусто = не использовать (по умолчанию решают хешрейт, зависание и вентиляторы).
fault_codes =

# Пароль admin, который ты задал в WhatsMinerTool (см. README — с паролем по умолчанию
# запись по API обычно не работает).
password = admin

# Для новых прошивок с API v3 (M6x и т.п.) — пароль учётки super (по умолчанию super).
password_v3 = super

# Версия API: auto (сам определит), v2 (порт 4028) или v3 (порт 4433).
api = auto

# Таймаут ответа асика, секунд.
timeout = 10

# Если асик вообще не отвечает unreachable_checks проверок подряд — пришлёт тревогу.
unreachable_checks = 5

# Необязательно: команда на случай, когда асик не отвечает совсем (по API его уже не
# перезагрузить). Например, выключить/включить умную розетку или реле.
# Подстановки: {name} и {host}. Пример для розетки Shelly:
#   on_unreachable = curl -s "http://192.168.1.50/relay/0?turn=off" && sleep 15 && curl -s "http://192.168.1.50/relay/0?turn=on"
on_unreachable =
# Не чаще чем раз в столько секунд на один асик.
hook_cooldown = 1800

# Режим «только смотреть»: всё пишет и шлёт в Telegram, но ничего не перезагружает.
# Удобно первые сутки, чтобы убедиться, что сторож видит падения правильно.
dry_run = no

# Лог и журнал инцидентов (CSV, открывается в Excel). Пути — относительно этого файла.
log_file = wm_watchdog.log
events_file = wm_events.csv


[telegram]
# Бот: создать у @BotFather, токен вставить сюда.
# chat_id: написать боту что-нибудь, затем открыть
#   https://api.telegram.org/bot<ТОКЕН>/getUpdates  и взять "chat":{"id": ...}
# Пусто = без уведомлений.
token =
chat_id =
# Присылать «снова хеширует» после успешного ребута.
notify_recovery = yes
# Ежедневная сводка в этот час (0–23). Пусто = не присылать.
daily_report_hour = 9
# Если api.telegram.org недоступен — можно указать своё зеркало/прокси Bot API.
api_url =


[miners]
# имя = IP. Найти асики в сети:  python3 wm_watchdog.py scan 192.168.1.0/24
asic-01 = 192.168.1.101
asic-02 = 192.168.1.102
asic-03 = 192.168.1.103


# Индивидуальные настройки для конкретного асика (необязательно).
# Можно переопределить: host, password, password_v3, api, port, port_v3,
# expected_ths, min_hashrate_pct, check_dead_boards, actions, enabled.
#
# [miner:asic-02]
# password = другой_пароль
# expected_ths = 110
# enabled = no
